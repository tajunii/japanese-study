<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>일본어 주간 학습</title>

<style>
body{
    font-family:sans-serif;
    background:#f5f5f5;
    margin:0;
    padding:20px;
}

.container{
    max-width:1200px;
    margin:auto;
}

h1{
    text-align:center;
    font-size:48px;
}

.section{
    margin-top:20px;
}

button{
    width:100%;
    padding:20px;
    font-size:32px;
    cursor:pointer;
    border:none;
    border-radius:10px;
    background:#1976d2;
    color:white;
}

.content{
    display:none;
    background:white;
    padding:20px;
    margin-top:10px;
    border-radius:10px;
    font-size:32px;
    line-height:1.8;
    white-space:pre-wrap;
}

#audioBtn{
    background:#388e3c;
}
</style>
</head>

<body>

<div class="container">

<h1 id="title"></h1>

<div class="section">
<button id="audioBtn">▶ 음성 듣기</button>
<audio id="audioPlayer"></audio>
</div>

<div class="section">
<button onclick="toggle('script')">스크립트</button>
<div id="script" class="content"></div>
</div>

<div class="section">
<button onclick="toggle('translation')">해석</button>
<div id="translation" class="content"></div>
</div>

<div class="section">
<button onclick="toggle('words')">단어</button>
<div id="words" class="content"></div>
</div>

<div class="section">
<button onclick="toggle('grammar')">문법</button>
<div id="grammar" class="content"></div>
</div>

<div class="section">
<button onclick="toggle('conversation')">대화 연습</button>
<div id="conversation" class="content"></div>
</div>

</div>

<script src="lesson.js"></script>

<script>

document.getElementById("title").textContent = lesson.title;

document.getElementById("script").textContent =
lesson.script;

document.getElementById("translation").textContent =
lesson.translation;

document.getElementById("words").textContent =
lesson.words;

document.getElementById("grammar").textContent =
lesson.grammar;

document.getElementById("conversation").textContent =
lesson.conversation;

document.getElementById("audioPlayer").src =
lesson.audio;

document.getElementById("audioBtn").addEventListener(
"click",
()=>{
document.getElementById("audioPlayer").play();
}
);

function toggle(id){

const el = document.getElementById(id);

if(el.style.display==="block"){
el.style.display="none";
}else{
el.style.display="block";
}

}

</script>

</body>
</html>
