<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>일본어 학습 시스템</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0f172a; color: #f8fafc; font-family: sans-serif; }
        .view { display: none; } .view.active { display: block; }
        .card { background-color: #1e293b; border: 1px solid #334155; }
    </style>
</head>
<body class="p-6">
    <div id="app" class="max-w-4xl mx-auto">
        <header class="mb-6 border-b border-slate-700 pb-4">
            <h1 class="text-3xl font-bold">일본어 학습 시스템</h1>
            <p class="text-slate-400">데이터는 GitHub(data/week_01.json)에서 실시간으로 불러옵니다.</p>
        </header>

        <!-- 메뉴 -->
        <div id="main-view" class="view active grid grid-cols-2 gap-4">
            <button onclick="showView('intensive')" class="card p-8 rounded-lg text-left hover:bg-slate-700 transition">
                <h2 class="text-2xl font-bold mb-2">모드 1: Intensive</h2>
                <p class="text-slate-400">쉐도잉, 어휘, 대화 연습</p>
            </button>
            <button onclick="showView('fluency')" class="card p-8 rounded-lg text-left hover:bg-slate-700 transition">
                <h2 class="text-2xl font-bold mb-2">모드 2: Fluency</h2>
                <p class="text-slate-400">즉각 발화 훈련</p>
            </button>
        </div>

        <!-- 모드 1 View -->
        <div id="intensive-view" class="view">
            <button onclick="showView('main')" class="text-blue-400 mb-4">← 뒤로</button>
            <div id="int-content" class="card p-8 rounded-lg space-y-6">
                <!-- 데이터가 여기로 로드됨 -->
            </div>
        </div>

        <!-- 모드 2 View -->
        <div id="fluency-view" class="view">
            <button onclick="showView('main')" class="text-blue-400 mb-4">← 뒤로</button>
            <div class="card p-10 text-center rounded-lg">
                <h2 class="text-2xl font-bold mb-8">즉각 발화 훈련</h2>
                <div id="drill-kr" class="text-4xl font-bold mb-6"></div>
                <div id="drill-jp" class="text-4xl text-blue-400 font-bold mb-10 hidden"></div>
                <button onclick="nextDrill()" class="bg-blue-600 px-12 py-4 rounded-xl text-xl font-bold">정답 확인 / 다음</button>
            </div>
        </div>
    </div>

    <script>
        let data = null;
        let drillIdx = 0;

        async function loadData() {
            try {
                // TV와 PC가 동일하게 읽을 수 있도록 GitHub의 raw 데이터 주소를 사용하세요.
                // 배포 주소 뒤에 data/week_01.json을 붙여서 불러옵니다.
                const response = await fetch('data/week_01.json?t=' + new Date().getTime());
                data = await response.json();
                render();
            } catch(e) {
                document.getElementById('int-content').innerHTML = `<p class="text-red-400">데이터를 불러오지 못했습니다. 경로를 확인하세요.</p>`;
            }
        }

        function render() {
            const m1 = data.mode1_intensive;
            document.getElementById('int-content').innerHTML = `
                <h2 class="text-3xl font-bold text-blue-400">${m1.title}</h2>
                <div><h3 class="text-sm text-slate-400">스크립트</h3><p class="p-4 bg-slate-900 rounded">${m1.script}</p></div>
                <div><h3 class="text-sm text-slate-400">해석</h3><p class="p-4 bg-slate-900 rounded">${m1.translation}</p></div>
                <div><h3 class="text-sm text-slate-400">단어/문법</h3><ul class="list-disc pl-5">${m1.grammar_vocab.map(v => `<li>${v.item}: ${v.desc}</li>`).join('')}</ul></div>
            `;
            renderDrill();
        }

        function renderDrill() {
            const d = data.mode2_fluency.drills[drillIdx];
            document.getElementById('drill-kr').innerText = d.kr;
            document.getElementById('drill-jp').innerText = d.jp;
            document.getElementById('drill-jp').classList.add('hidden');
        }

        function nextDrill() {
            const el = document.getElementById('drill-jp');
            if(el.classList.contains('hidden')) el.classList.remove('hidden');
            else { drillIdx = (drillIdx + 1) % data.mode2_fluency.drills.length; renderDrill(); }
        }

        function showView(v) {
            document.querySelectorAll('.view').forEach(el => el.classList.remove('active'));
            document.getElementById(v + '-view').classList.add('active');
        }
        window.onload = loadData;
    </script>
</body>
</html>
