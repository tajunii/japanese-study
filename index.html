<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>일본어 학습 시스템</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0f172a; color: #f8fafc; font-family: sans-serif; }
        .view { display: none; } .view.active { display: block; }
        .card { background-color: #1e293b; border: 1px solid #334155; padding: 2rem; border-radius: 1rem; }
        .content-box { background-color: #334155; border-radius: 0.5rem; padding: 1.5rem; margin-top: 0.5rem; font-size: 1.25rem; }
        ruby rt { color: #f87171; font-size: 0.75rem; }
    </style>
</head>
<body class="p-6">
    <div id="app" class="max-w-4xl mx-auto">
        <!-- 1. 메인 메뉴 -->
        <div id="main-view" class="view active">
            <h1 class="text-3xl font-bold mb-8">학습 메뉴</h1>
            <div class="grid grid-cols-1 gap-4">
                <button onclick="showView('script')" class="card text-2xl font-bold hover:bg-slate-700">쉐도잉 연습</button>
                <button onclick="showView('trans')" class="card text-2xl font-bold hover:bg-slate-700">원문 해석</button>
                <button onclick="showView('grammar')" class="card text-2xl font-bold hover:bg-slate-700">단어 및 문법</button>
                <button onclick="showView('dialog')" class="card text-2xl font-bold hover:bg-slate-700">대화문</button>
            </div>
        </div>

        <!-- 쉐도잉 연습 -->
        <div id="script-view" class="view">
            <h2 class="text-2xl font-bold mb-4">쉐도잉 연습</h2>
            <!-- 오디오 재생기 (파일명 수정함) -->
            <audio controls class="w-full mb-4 bg-slate-700 rounded-lg p-2">
                <source src="audio/script.mp3" type="audio/mpeg">
                브라우저가 오디오를 지원하지 않습니다.
            </audio>
            <div class="content-box" id="script-text"></div>
            <button onclick="showView('main')" class="mt-6 text-blue-400">← 뒤로</button>
        </div>

        <!-- 원문 해석 -->
        <div id="trans-view" class="view"><h2 class="text-2xl font-bold mb-4">원문 해석</h2><div class="content-box" id="trans-text"></div><button onclick="showView('main')" class="mt-6 text-blue-400">← 뒤로</button></div>
        
        <!-- 단어 및 문법 -->
        <div id="grammar-view" class="view"><h2 class="text-2xl font-bold mb-4">단어 및 문법</h2><div class="content-box" id="grammar-text"></div><button onclick="showView('main')" class="mt-6 text-blue-400">← 뒤로</button></div>
        
        <!-- 대화문 -->
        <div id="dialog-view" class="view"><h2 class="text-2xl font-bold mb-4">대화문</h2><div class="content-box" id="dialog-text"></div><button onclick="showView('main')" class="mt-6 text-blue-400">← 뒤로</button></div>
    </div>

    <script>
        const content = {
            script: "<ruby>風<rt>ふう</rt>鈴<rt>りん</rt></ruby>」を<ruby>飾<rt>かざ</rt></ruby>る<ruby>季節<rt>きせつ</rt></ruby>になりました。<br>愛媛県松山市の商店街では、毎年、観光に来た人などに涼しく感じてもらうため、店の前に風鈴を飾ります。<br>今年も、店の人や高校生たちが、愛媛県でつくった砥部焼の風鈴を飾りました。金魚や朝顔など夏らしい絵がかいてあります。<br>風鈴を飾った高校生は「音を聞いて、涼しく感じてほしいです」と話していました。<br>大分県から来た女性は「今はあまり風鈴を見ないので、昔のようでいいですね。とても涼しくなりました」と話していました。",
            trans: "[원문]<br>「風鈴」を飾る季節になりました。愛媛県松山市の商店街では、毎年、観光に来た人などに涼しく感じてもらうため、店の前に風鈴を飾ります。<br>[해석]<br>'풍경'을 장식하는 계절이 되었습니다. 에히메현 마츠야마시의 상점가에서는 매년 관광객들에게 시원함을 느끼게 해주기 위해 가게 앞에 풍경을 장식합니다.",
            grammar: "<h3 class='text-blue-400 font-bold'>단어</h3><ul><li><strong>風鈴(ふうりん)</strong>: 풍경</li><li><strong>昔(むかし)</strong>: 옛날</li><li><strong>涼しい(すずしい)</strong>: 서늘하다</li></ul><br><h3 class='text-blue-400 font-bold'>문법</h3><ul><li><strong>~ので</strong>: ~하기 때문에 <span style='color: #fbbf24;'>(예: 비가 와서 우산을 썼어요.)</span></li><li><strong>~てもらう</strong>: ~해 받다 <span style='color: #fbbf24;'>(예: 친구에게 부탁했어요.)</span></li><li><strong>~てほしい</strong>: ~해주길 바란다 <span style='color: #fbbf24;'>(예: 연습해주길 바라요.)</span></li></ul>",
            dialog: "<p>風鈴の季節になりましたね。<br><span style='color: #94a3b8;'>풍경의 계절이 되었네요.</span></p><p>そうですね、もう夏を感じます。<br><span style='color: #94a3b8;'>그러네요, 벌써 여름을 느껴요.</span></p><p>松山の商店街では何をしているんですか。<br><span style='color: #94a3b8;'>마츠야마 상점가에서는 무엇을 하고 있나요?</span></p><p>涼しく感じてもらうために風鈴を飾っています。<br><span style='color: #94a3b8;'>시원함을 느끼게 해주기 위해 풍경을 장식하고 있어요.</span></p>"
        };

        function showView(v) {
            document.querySelectorAll('.view').forEach(el => el.classList.remove('active'));
            document.getElementById(v + '-view').classList.add('active');
        }

        document.getElementById('script-text').innerHTML = content.script;
        document.getElementById('trans-text').innerHTML = content.trans;
        document.getElementById('grammar-text').innerHTML = content.grammar;
        document.getElementById('dialog-text').innerHTML = content.dialog;
    </script>
</body>
</html>
